<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公館路口 · 影像校正點標記工具</title>
<!--
  零 CDN、完全離線。這支工具**不會**把影像送到任何地方 —— 影像只在這個分頁的
  記憶體與 canvas 裡,匯出的 JSON 只有像素座標與地面座標。

  兩種開法:
    (a) 本機開發站(建議):http://localhost:8124/vision/calibrate.html
        —— 這樣可以自動讀 calib/marks_catalog.json
    (b) 直接用瀏覽器開這個檔:file:// 讀不到同目錄的 JSON,請手動載入目錄檔。

  這裡**不做**閘門判定。條件數、殘差比值、Monte-Carlo 抖動自檢一律由
  `calibrate.py solve` 負責 —— 數學只留一份,免得兩邊漂移。
-->
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16181d; --muted: #5b6472;
    --line: #d9dde3; --accent: #1f6feb; --warn: #b45309; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --ink: #e8eaee; --muted: #9aa4b2;
            --line: #2a2f3a; --accent: #58a6ff; --warn: #f0b429; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5
         system-ui, -apple-system, "Noto Sans TC", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0 0 4px; font-size: 16px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 12px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 12px; }
  #stage { position: relative; overflow: auto; max-height: 78vh; }
  canvas { display: block; max-width: 100%; cursor: crosshair; }
  #loupe { position: fixed; width: 180px; height: 180px; border: 2px solid var(--accent);
           border-radius: 50%; pointer-events: none; display: none; z-index: 20;
           background: var(--panel); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  label { display: block; margin: 8px 0 3px; font-size: 12px; color: var(--muted); }
  select, input, button, textarea { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: transparent; }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>公館路口 · 影像校正點標記工具</h1>
  <p>在你的影像上點地面標記的角落 → 匯出點位 JSON → 用
     <code>python calibrate.py solve</code> 解 homography 並跑閘門。
     影像不離開這個分頁。</p>
</header>

<main>
  <section class="panel" id="stage">
    <canvas id="canvas" width="960" height="540"></canvas>
    <p class="hint" id="stageHint">先載入一張影像。滑鼠移到畫面上會出現 4× 放大鏡;
       點一下就把目前選定的「標記 + 角落」記錄下來。</p>
  </section>

  <section class="panel">
    <label for="imageInput">1. 載入影像(你的攝影機截圖)</label>
    <input id="imageInput" type="file" accept="image/*">

    <label for="catalogInput">2. 地面標記目錄 <span id="catalogState" class="hint"></span></label>
    <input id="catalogInput" type="file" accept="application/json">

    <label for="cameraId">3. 攝影機代號</label>
    <input id="cameraId" type="text" value="cam-roosevelt-se">

    <label for="bandSelect">4. 選一條畫線帶</label>
    <select id="bandSelect"></select>

    <label for="markSelect">5. 選一條白漆</label>
    <select id="markSelect"></select>

    <label for="cornerSelect">6. 選角落</label>
    <select id="cornerSelect">
      <option value="sMin,tMin">sMin,tMin</option>
      <option value="sMax,tMin">sMax,tMin</option>
      <option value="sMax,tMax">sMax,tMax</option>
      <option value="sMin,tMax">sMin,tMax</option>
    </select>

    <p class="hint" id="advice"></p>

    <label>7. 計數區(攝影機實際看得到的路段,單位公尺)</label>
    <div class="row">
      <input id="roiSMin" type="number" step="0.1" value="-20" title="sMin">
      <input id="roiSMax" type="number" step="0.1" value="20" title="sMax">
    </div>
    <div class="row" style="margin-top:6px">
      <input id="roiTMin" type="number" step="0.1" value="-13.22" title="tMin">
      <input id="roiTMax" type="number" step="0.1" value="14.18" title="tMax">
      <input id="roiLanes" type="number" step="1" value="6" title="涵蓋幾條一般車道">
    </div>

    <div class="row" style="margin-top:12px">
      <button id="exportBtn">匯出點位 JSON</button>
      <button id="undoBtn" class="secondary">刪最後一點</button>
      <button id="clearBtn" class="secondary">全部清除</button>
    </div>

    <table id="pointTable">
      <thead><tr><th>#</th><th>白漆 / 角落</th><th class="num">px</th><th class="num">s, t</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<canvas id="loupe" width="180" height="180"></canvas>

<script>
"use strict";
const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const loupe = document.querySelector("#loupe");
const loupeCtx = loupe.getContext("2d");
const state = { image: null, catalog: null, points: [] };

const el = (id) => document.querySelector(id);

function setCatalog(payload) {
  if (payload?.schema !== "gongguan.vision.marks.v1") {
    el("#catalogState").textContent = "目錄 schema 不符";
    el("#catalogState").className = "hint warn";
    return;
  }
  state.catalog = payload;
  el("#catalogState").textContent = `已載入 ${payload.marks.length} 條白漆`;
  el("#catalogState").className = "hint ok";
  const bands = [...new Set(payload.marks.map((m) => m.band))];
  el("#bandSelect").innerHTML = bands
    .map((b) => `<option value="${b}">${b}（${payload.bands[b]} 條）</option>`).join("");
  fillMarks();
}

function fillMarks() {
  if (!state.catalog) return;
  const band = el("#bandSelect").value;
  const marks = state.catalog.marks.filter((m) => m.band === band);
  el("#markSelect").innerHTML = marks.map((m, i) =>
    `<option value="${m.name}">${i.toString().padStart(2, "0")} · s ${m.sMin.toFixed(1)}…`
    + `${m.sMax.toFixed(1)}, t ${m.tMin.toFixed(1)}…${m.tMax.toFixed(1)}</option>`).join("");
}

function currentGround() {
  const mark = state.catalog?.marks.find((m) => m.name === el("#markSelect").value);
  if (!mark) return null;
  const corner = mark.corners.find((c) => c.corner === el("#cornerSelect").value);
  return corner ? { mark, corner } : null;
}

function draw() {
  if (!state.image) return;
  ctx.drawImage(state.image, 0, 0, canvas.width, canvas.height);
  for (const [index, point] of state.points.entries()) {
    const x = point.px[0] * canvas.width / state.image.naturalWidth;
    const y = point.px[1] * canvas.height / state.image.naturalHeight;
    ctx.strokeStyle = "#ff3b30";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y);
    ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
    ctx.fillStyle = "#ffd60a";
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillText(String(index), x + 6, y - 6);
  }
}

function refreshTable() {
  const body = el("#pointTable tbody");
  body.innerHTML = state.points.map((point, index) => `<tr>
      <td>${index}</td>
      <td>${point.label.replace(/^GongguanV\d+_/, "")}<br><code>${point.corner}</code></td>
      <td class="num">${point.px[0].toFixed(0)}, ${point.px[1].toFixed(0)}</td>
      <td class="num">${point.s.toFixed(2)}, ${point.t.toFixed(2)}</td>
    </tr>`).join("");
  const bands = new Set(state.points.map((p) => p.band));
  const messages = [];
  if (state.points.length < 6) {
    messages.push(`<span class="warn">目前 ${state.points.length} 點,建議至少 6 點。`
      + `4 點沒有冗餘,單點對錯查不出來。</span>`);
  }
  if (state.points.length >= 2 && bands.size < 2) {
    messages.push(`<span class="warn">所有點都在同一條畫線帶上。實測基線縮短會讓誤差`
      + `暴增 20 倍,而條件數完全不會警告 —— 請換一條帶再點幾個。</span>`);
  }
  if (state.points.length >= 6 && bands.size >= 2) {
    messages.push(`<span class="ok">點數與跨帶都達標。接著跑 `
      + `<code>python calibrate.py solve</code> 做真正的閘門判定。</span>`);
  }
  el("#advice").innerHTML = messages.join("<br>");
}

canvas.addEventListener("mousemove", (event) => {
  if (!state.image) return;
  const rect = canvas.getBoundingClientRect();
  const cx = (event.clientX - rect.left) / rect.width * canvas.width;
  const cy = (event.clientY - rect.top) / rect.height * canvas.height;
  const sx = cx * state.image.naturalWidth / canvas.width;
  const sy = cy * state.image.naturalHeight / canvas.height;
  const zoom = 4;
  const half = loupe.width / (2 * zoom);
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, loupe.width, loupe.height);
  loupeCtx.drawImage(state.image, sx - half, sy - half, half * 2, half * 2,
                     0, 0, loupe.width, loupe.height);
  loupeCtx.strokeStyle = "#ff3b30";
  loupeCtx.beginPath();
  loupeCtx.moveTo(loupe.width / 2, 0); loupeCtx.lineTo(loupe.width / 2, loupe.height);
  loupeCtx.moveTo(0, loupe.height / 2); loupeCtx.lineTo(loupe.width, loupe.height / 2);
  loupeCtx.stroke();
  loupe.style.display = "block";
  loupe.style.left = `${Math.min(window.innerWidth - 190, event.clientX + 20)}px`;
  loupe.style.top = `${Math.max(10, event.clientY - 190)}px`;
});
canvas.addEventListener("mouseleave", () => { loupe.style.display = "none"; });

canvas.addEventListener("click", (event) => {
  if (!state.image) { alert("先載入影像"); return; }
  const ground = currentGround();
  if (!ground) { alert("先載入地面標記目錄,並選一條白漆與角落"); return; }
  const rect = canvas.getBoundingClientRect();
  const px = [
    (event.clientX - rect.left) / rect.width * state.image.naturalWidth,
    (event.clientY - rect.top) / rect.height * state.image.naturalHeight,
  ];
  state.points.push({
    px, s: ground.corner.s, t: ground.corner.t,
    label: ground.mark.name, corner: ground.corner.corner, band: ground.mark.band,
  });
  draw();
  refreshTable();
});

el("#imageInput").addEventListener("change", (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  const image = new Image();
  image.onload = () => {
    state.image = image;
    const width = Math.min(1280, image.naturalWidth);
    canvas.width = width;
    canvas.height = Math.round(width * image.naturalHeight / image.naturalWidth);
    el("#stageHint").textContent =
      `影像 ${image.naturalWidth}×${image.naturalHeight}(匯出的像素座標是原始解析度)`;
    draw();
    URL.revokeObjectURL(image.src);
  };
  image.src = URL.createObjectURL(file);
});

el("#catalogInput").addEventListener("change", (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  file.text().then((text) => setCatalog(JSON.parse(text)))
    .catch((error) => { el("#catalogState").textContent = String(error); });
});

el("#bandSelect").addEventListener("change", fillMarks);
el("#undoBtn").addEventListener("click", () => { state.points.pop(); draw(); refreshTable(); });
el("#clearBtn").addEventListener("click", () => { state.points = []; draw(); refreshTable(); });

el("#exportBtn").addEventListener("click", () => {
  if (!state.image) { alert("先載入影像"); return; }
  const payload = {
    schema: "gongguan.vision.points.v1",
    camera: el("#cameraId").value.trim() || "camera",
    frame: { width: state.image.naturalWidth, height: state.image.naturalHeight },
    roi: {
      id: "visible",
      sMin: Number(el("#roiSMin").value), sMax: Number(el("#roiSMax").value),
      tMin: Number(el("#roiTMin").value), tMax: Number(el("#roiTMax").value),
      lanes: Number(el("#roiLanes").value),
      note: "使用者在 calibrate.html 指定的可見範圍。",
    },
    note: "由 calibrate.html 產生。影像未被儲存或上傳。",
    points: state.points.map((point) => ({
      mark: point.label, corner: point.corner, band: point.band,
      px: [Number(point.px[0].toFixed(2)), Number(point.px[1].toFixed(2))],
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"],
                        { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${payload.camera}.points.json`;
  link.click();
  URL.revokeObjectURL(link.href);
});

// 由 serve.py 提供時可以直接讀目錄;file:// 開啟會失敗,那就手動載入。
fetch("./calib/marks_catalog.json")
  .then((response) => (response.ok ? response.json() : Promise.reject(response.status)))
  .then(setCatalog)
  .catch(() => {
    el("#catalogState").textContent = "自動載入失敗,請手動選 calib/marks_catalog.json";
    el("#catalogState").className = "hint warn";
  });
refreshTable();
</script>
</body>
</html>
